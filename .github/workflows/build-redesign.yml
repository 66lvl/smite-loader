name: Build redesigned loader
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build redesigned loader
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.0 --repo 66lvl/smite-loader --pattern SmiteLoader-package.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          if ((Get-FileHash -Algorithm SHA256 SmiteLoader-package.zip).Hash -ne '09418cc474350c3762ef697f66fc9e4c9be0a4c251fa412fb7e46278a593c6ba') { throw 'Unexpected package hash' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $pwd 'SmiteLoader-package.zip'))
          $directory = Join-Path $pwd 'project\tools\loader'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          try {
            foreach ($name in @('SmiteLoader.csproj', 'GameLocator.cs', 'NativeDllInjector.cs', 'DumperConfiguration.cs')) {
              $entry = $zip.GetEntry("tools/loader/$name")
              if (-not $entry) { throw "Missing $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $directory $name), $true)
            }
          } finally { $zip.Dispose() }
          $source = [IO.File]::ReadAllText((Join-Path $pwd 'redesign\Program.cs'))
          [IO.File]::WriteAllText((Join-Path $directory 'Program.cs'), $source.TrimStart([char]0xFEFF), (New-Object System.Text.UTF8Encoding($true)))
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $root = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -property installationPath | Select-Object -First 1
          if (-not $root) { throw 'MSBuild not found' }
          $msbuild = Join-Path $root 'MSBuild\Current\Bin\MSBuild.exe'
          & $msbuild project\tools\loader\SmiteLoader.csproj /t:Rebuild /p:Configuration=Release /p:Platform=AnyCPU /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
          Copy-Item project\tools\loader\bin\Release\SmiteLoader.exe SmiteLoader.exe
      - name: Test WinForms layout
        shell: powershell
        run: |
          if ([Threading.Thread]::CurrentThread.ApartmentState -ne 'STA') { throw 'UI test requires STA' }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          [Windows.Forms.Application]::EnableVisualStyles()
          $asm = [Reflection.Assembly]::LoadFrom((Join-Path $pwd 'SmiteLoader.exe'))
          $type = $asm.GetType('SmiteLoader.LoaderForm', $true)
          $form = [Activator]::CreateInstance($type, $true)
          function Field($name) { $type.GetField($name, [Reflection.BindingFlags]'NonPublic,Instance').GetValue($form) }
          function Inside($control, $parent, $name) {
            $r = $control.Bounds
            if ($r.Left -lt 0 -or $r.Top -lt 0 -or $r.Right -gt $parent.ClientSize.Width -or $r.Bottom -gt $parent.ClientSize.Height) {
              throw "$name is outside its parent: $r / $($parent.ClientSize)"
            }
          }
          try {
            $form.Show()
            [Windows.Forms.Application]::DoEvents()
            $page = Field 'loaderPage'
            $gameCard = (Field 'inject').Parent
            $sdkCard = (Field 'update').Parent
            foreach ($dimensions in @(@(1020,790), @(1280,850), @(1500,1000))) {
              $form.ClientSize = New-Object Drawing.Size($dimensions[0], $dimensions[1])
              [Windows.Forms.Application]::DoEvents()
              Inside $gameCard $page 'Game card'
              Inside $sdkCard $page 'SDK card'
              Inside (Field 'log') $page 'Log'
              Inside (Field 'openLog') $page 'Open log'
              if ($gameCard.Right -gt $sdkCard.Left) { throw 'Cards overlap' }
              foreach ($name in @('inject','refresh','launchUpdateMode','update','finish')) {
                $button = Field $name
                Inside $button $button.Parent $name
              }
              Write-Host "Layout OK: $($form.ClientSize); page $($page.ClientSize)"
            }
            $form.ClientSize = New-Object Drawing.Size(1020,790)
            [Windows.Forms.Application]::DoEvents()
            $bmp = New-Object Drawing.Bitmap($form.Width, $form.Height)
            $form.DrawToBitmap($bmp, (New-Object Drawing.Rectangle(0, 0, $form.Width, $form.Height)))
            $bmp.Save((Join-Path $pwd 'layout-preview.png'), [Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          } finally { $form.Close(); $form.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: SmiteLoader-fixed-ui
          path: |
            SmiteLoader.exe
            layout-preview.png
          retention-days: 14
